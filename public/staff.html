<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>เข้าสู่ระบบเจ้าหน้าที่ | ศูนย์ยืม-คืนกายอุปกรณ์การแพทย์</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="loginView" class="login-wrap hidden">
  <div class="login-card card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
    </div>
    <h1>ศูนย์ยืม-คืนกายอุปกรณ์</h1>
    <p style="color:var(--text-muted); margin-top:-8px;">เข้าสู่ระบบสำหรับเจ้าหน้าที่</p>
    <div id="loginAlert"></div>
    <form id="loginForm" style="text-align:left; margin-top:10px;">
      <div class="field">
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
    </form>
    <p class="footer-note">ผู้ใช้ทั่วไป <a href="/request.html">ส่งคำขอยืมอุปกรณ์ที่นี่</a> (ไม่ต้อง login) · <a href="/">กลับหน้าแรก</a></p>
  </div>
</div>

<div id="appShell" class="hidden">
  <header class="app-header">
    <div class="brand"><span class="dot"></span>ยืม-คืนกายอุปกรณ์</div>
    <nav class="app-nav-desktop" id="navDesktop"></nav>
    <div class="userbox">
      <span id="userName"></span>
      <button class="ghost" id="logoutBtn">ออกจากระบบ</button>
    </div>
  </header>

  <div class="container" id="mainContainer"></div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<script src="/js/app.js"></script>
</body>
</html>
